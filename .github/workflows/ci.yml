name: AwesomeOS Agent Platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify C11 Model Ops ABI Header
        run: cc -std=c11 -Wall -Wextra -Werror -fsyntax-only -x c packages/model-ops/b8g_model_ops_abi.h

      - name: Build Dashboards
        run: npm run build:dashboards

      - name: Run Unit Test Suites (incl. browser-use & zer0q deadhand/cli)
        run: npm test

      - name: Verify ZER0Q CLI & Browser-Use / Deadhand Suites
        run: |
          node packages/zer0q-substrate/cli.mts --help --json > /dev/null
          node --test packages/browser-use/browser-use.test.mts packages/zer0q-substrate/deadhand-and-cli.test.mts

      - name: Run Platform Tutorials
        run: npm run tutorials
